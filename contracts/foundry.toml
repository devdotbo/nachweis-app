[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# read-only: prover fixtures (calldata-groth16.json) for the SP1 verifier tests, and compiled Uniswap factory bytecode for vm.getCode
fs_permissions = [
    { access = "read", path = "../prover-sp1/fixtures" },
    { access = "read", path = "./test/fixtures" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
