[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# read-only: prover fixtures (calldata-groth16.json) for the SP1 verifier tests, and compiled Uniswap factory bytecode for vm.getCode
fs_permissions = [
    { access = "read", path = "../prover-sp1/fixtures" },
    { access = "read", path = "./test/fixtures" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# bb-generated HonkVerifier (src/noir/PidSdJwtUltraHonkVerifier.sol) is 25,176 bytes at optimizer_runs 200,
# 600 bytes over EIP-170; at optimizer_runs 1 it is 24,246 bytes. Only that file compiles with the "honk"
# compiler profile, everything else keeps optimizer_runs 200. Not edited: any change to the circuit regenerates it.
[[profile.default.additional_compiler_profiles]]
name = "honk"
optimizer_runs = 1

[[profile.default.compilation_restrictions]]
paths = "src/noir/PidSdJwtUltraHonkVerifier.sol"
optimizer_runs = 1
