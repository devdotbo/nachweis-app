[package]
name = "nachweis_prover"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "On-phone UltraHonk prover for the Nachweis pid-sdjwt circuit (uniffi bindings)"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "nachweis_prover"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"
serde_json = "1"
base64 = "0.22"
flate2 = "1"
libc = "0.2"
hex = "0.4"

# Noir 1.0.0-beta.21: the same compiler the circuit artifact was built with.
acvm = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.21" }
bn254_blackbox_solver = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.21" }
nargo = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.21" }
noirc_abi = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.21" }

# Barretenberg 5.0.0-nightly.20260324: the bb the desktop VK and the Solidity
# verifier were produced with. The crate downloads the prebuilt static library
# for the build target from the AztecProtocol/barretenberg GitHub release.
barretenberg-rs = { version = "=5.0.0-nightly.20260324", default-features = false, features = ["ffi"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
